name: Record Demo (Pleos Emulator)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Free disk space and install emulator deps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /opt/microsoft /opt/google /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11* 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 libnss3 libxcursor1 >/dev/null
          df -h / /mnt | tail -2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pleos Connect v2.1.0 시스템 이미지(약 4GB)를 다음 실행부터 재사용
      - name: Cache Pleos system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/pleos_car_emulator
          key: pleos-connect-sysimg-2.1.0-r2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run Pleos emulator and record
        run: |
          set -o pipefail
          bash ci/record_demo_pleos.sh 2>&1 | tee demo_pleos_run.log

      - name: Collect outputs (always)
        if: always()
        run: |
          mkdir -p demo/pleos
          tail -n 400 demo_pleos_run.log > demo/pleos/run_log_tail.txt || true
          tail -n 80 demo/pleos/emulator.log > demo/pleos/emulator_tail.txt 2>/dev/null || true
          rm -f demo/pleos/emulator.log
          git config user.name "mosim-ci"
          git config user.email "ci@users.noreply.github.com"
          git add demo/pleos
          git commit -m "ci: Pleos emulator demo outputs [skip ci]" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

name: SDK Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch Pleos SDK artifacts and dump API
        run: |
          set +e
          R=https://nexus-playground.pleos.ai/repository/maven-releases/ai/pleos/playground
          mkdir -p probe sdk && cd sdk
          curl -s "https://nexus-playground.pleos.ai/service/rest/v1/search?repository=maven-releases&group=ai.pleos.playground" > ../probe/search.json || true
          for a in Vehicle TextToSpeech SpeechToText FusedLocation NaviHelper TTS STT Tts Stt Location Navihelper; do
            curl -sf "$R/$a/maven-metadata.xml" -o "$a-meta.xml" && echo "== $a" >> ../probe/artifacts.txt && cat "$a-meta.xml" >> ../probe/artifacts.txt
          done
          curl -sS -o /dev/null -w "repo root: %{http_code}\n" "$R/" >> ../probe/artifacts.txt
          curl -sS -L -o vehicle.aar -w "aar: %{http_code}\n" "$R/Vehicle/2.3.1/Vehicle-2.3.1.aar" >> ../probe/artifacts.txt
          ls -la vehicle.aar >> ../probe/artifacts.txt
          curl -sf "$R/Vehicle/2.3.1/Vehicle-2.3.1.pom" -o ../probe/vehicle.pom || true
          unzip -o -q vehicle.aar -d vehicle
          cp vehicle/AndroidManifest.xml ../probe/vehicle-manifest.xml || true
          cd vehicle && unzip -o -q classes.jar -d cls && cd cls
          find . -name '*.class' | sed 's#^\./##; s#\.class$##; s#/#.#g' | sort > ../../../probe/vehicle-classes.txt
          for c in $(grep -E '^ai\.pleos\.playground\.vehicle\.(Vehicle|api\.[A-Za-z]+|listener\.[A-Za-z]+)$' ../../../probe/vehicle-classes.txt); do
            echo "##### $c" >> ../../../probe/vehicle-api.txt
            javap -classpath . "$c" >> ../../../probe/vehicle-api.txt 2>&1 || true
          done
          for c in $(grep -E '^ai\.pleos\.playground\.vehicle\.constant\.' ../../../probe/vehicle-classes.txt | grep -v '\$' | head -80); do
            echo "##### $c" >> ../../../probe/vehicle-constants.txt
            javap -constants -classpath . "$c" >> ../../../probe/vehicle-constants.txt 2>&1 || true
          done
      - name: Commit probe output
        if: always()
        run: |
          git config user.name "mosim-ci"
          git config user.email "ci@users.noreply.github.com"
          git add probe
          git commit -m "ci: Pleos SDK API probe [skip ci]" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

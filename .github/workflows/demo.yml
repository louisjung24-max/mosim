name: Record Demo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Free disk space and install emulator deps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost 2>/dev/null || true
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 libnss3 libxcursor1 >/dev/null
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run emulator and record
        id: rec
        run: |
          set -o pipefail
          bash ci/record_demo.sh 2>&1 | tee demo_run.log

      - name: Collect logs (always)
        if: always()
        run: |
          mkdir -p demo
          tail -n 400 demo_run.log > demo/run_log_tail.txt || true
          rm -f demo/emulator.log
          git config user.name "mosim-ci"
          git config user.email "ci@users.noreply.github.com"
          git pull --rebase origin main || true
          git add demo
          git diff --cached --quiet || git commit -m "ci: emulator demo outputs [skip ci]"
          git push || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosim-demo
          path: demo/*
